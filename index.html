<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Mondo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --sea:#d9e4e6; --land:#f5f0e6; --border:#d8ccb4; --ink:#2b2a27; --muted:#7a7468;
  --card:#fffdf8; --line:#ece4d4;
  --c-monumento:#c2553a; --c-culto:#7b4fa0; --c-citta:#2f6f9f; --c-natura:#3f8a4e;
  --c-museo:#b8862b; --c-evento:#d14f8a; --c-curiosita:#1f9a95; --c-cibo:#e07b2a; --c-altro:#6b6b6b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--sea);font-family:Inter,system-ui,sans-serif;color:var(--ink)}
#map{position:fixed;inset:0;background:var(--sea)}
.leaflet-container{background:var(--sea);font-family:Inter,system-ui,sans-serif}
.leaflet-control-layers{border-radius:12px!important;border:1px solid var(--line)!important;font-size:13px}
.leaflet-control-zoom a{color:var(--ink)!important}
.leaflet-control-attribution{background:rgba(255,253,248,.7)!important;font-size:10px;color:var(--muted)}

/* barra superiore */
#top{position:fixed;top:12px;left:12px;right:12px;z-index:900;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.brand{pointer-events:auto;background:rgba(255,253,248,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:8px 14px;box-shadow:0 4px 18px rgba(60,50,30,.08)}
.brand h1{margin:0;font:700 18px/1.1 Fraunces,serif;letter-spacing:.2px}
.brand small{color:var(--muted);font-size:11.5px}
#legendBtn{pointer-events:auto;margin-left:auto;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font:600 13px Inter;color:var(--ink);cursor:pointer;box-shadow:0 4px 18px rgba(60,50,30,.08)}
#legend{position:fixed;top:64px;right:12px;z-index:900;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(60,50,30,.15);display:none;min-width:190px}
#legend.open{display:block}
.lg-row{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:8px;cursor:pointer;font-size:13.5px;user-select:none}
.lg-row:hover{background:#f6f0e3}
.lg-row.off{opacity:.35}
.lg-row .n{margin-left:auto;color:var(--muted);font-size:12px}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12)}

/* pin */
.pin{width:var(--s);height:var(--s);border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;transition:transform .15s}
.pin svg{transform:rotate(45deg);width:58%;height:58%;fill:#fff}
.pin.small{border-radius:50%;transform:none;border-width:1.5px}
.pin.small svg{display:none}
.pin.sel{transform:rotate(-45deg) scale(1.25)}
.pin-wrap{background:none;border:none}
.pin-label{position:absolute;left:calc(var(--s) + 8px);top:50%;transform:translateY(-50%);white-space:nowrap;font:600 12px Inter;color:var(--ink);background:rgba(255,253,248,.9);padding:2px 7px;border-radius:7px;border:1px solid var(--line);pointer-events:none}

/* scheda */
#card{position:fixed;z-index:1000;background:var(--card);box-shadow:0 18px 50px rgba(40,30,10,.22);border:1px solid var(--line);overflow:auto;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s;opacity:0;pointer-events:none}
#card.open{opacity:1;pointer-events:auto}
@media (min-width:760px){
  #card{top:76px;right:16px;bottom:16px;width:380px;border-radius:20px;transform:translateX(30px)}
  #card.open{transform:none}
}
@media (max-width:759px){
  #card{left:0;right:0;bottom:0;max-height:72vh;border-radius:22px 22px 0 0;transform:translateY(40px);padding-bottom:env(safe-area-inset-bottom)}
  #card.open{transform:none}
  #card .grab{display:block}
}
.grab{display:none;width:40px;height:4px;border-radius:4px;background:#ddd3c0;margin:9px auto 0}
.hero{position:relative;height:190px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));display:flex;align-items:flex-end}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ico{position:absolute;right:18px;top:18px;width:54px;height:54px;opacity:.22;fill:#fff}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.45))}
.hero .chip{position:relative;z-index:1;margin:14px 16px;background:rgba(255,255,255,.92);color:var(--c);font:600 11.5px Inter;letter-spacing:.6px;text-transform:uppercase;padding:5px 10px;border-radius:99px}
.close{position:absolute;z-index:2;top:12px;left:12px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(255,255,255,.92);font-size:18px;line-height:32px;cursor:pointer;color:var(--ink)}
.body{padding:18px 20px 22px}
.body h2{font:700 25px/1.15 Fraunces,serif;margin:0 0 6px}
.where{color:var(--muted);font-size:13.5px;display:flex;gap:6px;align-items:center}
.where svg{width:14px;height:14px;fill:var(--c);flex:none}
.sintesi{font-size:15px;line-height:1.55;margin:14px 0 4px}
.sec{margin-top:16px}
.sec h3{font:600 11.5px Inter;letter-spacing:1px;text-transform:uppercase;color:var(--c);margin:0 0 8px}
.sec ul{margin:0;padding:0;list-style:none}
.sec li{position:relative;padding:5px 0 5px 18px;font-size:14px;line-height:1.45;border-bottom:1px dashed var(--line)}
.sec li:last-child{border-bottom:none}
.sec li::before{content:"";position:absolute;left:2px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--c)}
.curio{background:color-mix(in srgb,var(--c) 9%,#fff);border-left:3px solid var(--c);padding:10px 12px;border-radius:0 10px 10px 0;font-size:14px;line-height:1.5}
.meta{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.meta a{color:var(--muted)}
.badge{display:inline-block;margin-top:10px;font-size:11px;color:#8a5a00;background:#fff3d6;border:1px solid #f0d9a0;padding:3px 8px;border-radius:6px}

/* stato vuoto / suggerimento */
#hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:800;background:rgba(43,42,39,.86);color:#fff;font-size:13px;padding:9px 14px;border-radius:99px;transition:opacity .4s;white-space:nowrap}
#hint.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div class="brand"><h1>Mondo</h1><small id="count">—</small></div>
  <button id="legendBtn">Tipi ▾</button>
</div>
<div id="legend"></div>
<div id="hint">Avvicinati a un pin per aprire la scheda</div>

<aside id="card" aria-live="polite"></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
const TIPI = {
  monumento:{nome:"Monumento",   ico:'<path d="M12 2l3 4h-2v3h3v2h-2l1 9h3v2H6v-2h3l1-9H8V9h3V6H9z"/>'},
  culto:    {nome:"Luogo di culto", ico:'<path d="M11 2h2v3h3v2h-3v3l5 4v8h-5v-5h-2v5H6v-8l5-4V7H8V5h3z"/>'},
  citta:    {nome:"Città / borgo", ico:'<path d="M3 21V10l5-3v3l5-3v4h3V4h5v17zm3-2h2v-3H6zm5 0h2v-3h-2zm6-9h2V8h-2zm0 4h2v-2h-2zm0 5h2v-3h-2z"/>'},
  natura:   {nome:"Natura / paesaggio", ico:'<path d="M14 6l-4.2 5.6 1.3 1.7L14 9.3 19 16H5l3.5-4.7L2 20h20z"/>'},
  museo:    {nome:"Museo / arte", ico:'<path d="M12 2l10 5v2H2V7zM4 10h3v8H4zm6.5 0h3v8h-3zM17 10h3v8h-3zM2 19h20v3H2z"/>'},
  evento:   {nome:"Evento", ico:'<path d="M7 2h2v2h6V2h2v2h3v18H4V4h3zm-1 7v11h12V9zm2 2h3v3H8z"/>'},
  curiosita:{nome:"Curiosità", ico:'<path d="M12 2a7 7 0 00-4 12.7V18h8v-3.3A7 7 0 0012 2zM9 20h6v2H9z"/>'},
  cibo:     {nome:"Cibo / locale", ico:'<path d="M7 2v8a2 2 0 01-2 2v10H3V12a2 2 0 01-2-2V2h1.5v6h1V2h1.5v6h1V2zm9 0c2.2 0 4 2.7 4 6.5 0 2.4-1 4-2.5 4.6V22h-3V2z"/>'},
  altro:    {nome:"Altro", ico:'<circle cx="12" cy="12" r="5"/>'}
};
const PIN_ICO = '<path d="M12 2a7 7 0 00-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6.5a2.5 2.5 0 010 5z"/>';
const col = t => getComputedStyle(document.documentElement).getPropertyValue('--c-'+(TIPI[t]?t:'altro')).trim();
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const map = L.map('map',{zoomControl:false,worldCopyJump:false,minZoom:2,maxZoom:18,
  maxBounds:[[-85,-200],[85,200]],maxBoundsViscosity:.8,attributionControl:true}).setView([30,12],2);
L.control.zoom({position:'bottomright'}).addTo(map);
map.attributionControl.setPrefix('Leaflet');

const BASE={
  "Carta": L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_nolabels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'}),
  "Satellite": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,
    attribution:'Tiles &copy; Esri &mdash; Maxar, Earthstar Geographics'})
};
const LABELS=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,pane:'overlayPane'});
let baseName='Carta';try{baseName=localStorage.getItem('mondo-base')||'Carta';}catch(e){}
if(!BASE[baseName])baseName='Carta';
BASE[baseName].addTo(map);
L.control.layers(BASE,{"Etichette":LABELS},{position:'bottomleft'}).addTo(map);
map.on('baselayerchange',e=>{try{localStorage.setItem('mondo-base',e.name);}catch(_){}});
let places=[], markers=[], hidden=new Set(), selected=null;
const card=document.getElementById('card');

function icon(p,z){
  const small=z<5, s=small?12:(z<9?26:32), c=col(p.tipo);
  const lab = z>=9 ? `<span class="pin-label">${esc(p.nome)}</span>`:'';
  return L.divIcon({className:'pin-wrap',iconSize:[s,s],iconAnchor:small?[s/2,s/2]:[s/2,s*1.05],
    html:`<div style="position:relative;--s:${s}px"><div class="pin ${small?'small':''} ${selected===p?'sel':''}" style="--c:${c};--s:${s}px"><svg viewBox="0 0 24 24">${(TIPI[p.tipo]||TIPI.altro).ico}</svg></div>${lab}</div>`});
}
function render(){
  markers.forEach(m=>map.removeLayer(m));markers=[];
  const z=map.getZoom();
  places.forEach(p=>{
    if(hidden.has(p.tipo))return;
    const m=L.marker([p.lat,p.lng],{icon:icon(p,z),riseOnHover:true}).addTo(map);
    m.on('click',()=>{openCard(p);if(map.getZoom()<12)map.flyTo([p.lat,p.lng],Math.max(map.getZoom(),14),{duration:1.2});});
    m._p=p;markers.push(m);
  });
}
function openCard(p){
  selected=p;const c=col(p.tipo),T=TIPI[p.tipo]||TIPI.altro;
  card.style.setProperty('--c',c);
  card.innerHTML=`<div class="grab"></div>
  <div class="hero" style="--c:${c}">${p.foto?'<img alt="">':''}<svg class="ico" viewBox="0 0 24 24">${T.ico}</svg>
    <button class="close" aria-label="Chiudi">×</button><span class="chip">${esc(T.nome)}</span></div>
  <div class="body">
    <h2>${esc(p.nome)}</h2>
    <div class="where"><svg viewBox="0 0 24 24">${PIN_ICO}</svg>${esc(p.luogo)}</div>
    ${p.esempio?'<span class="badge">Scheda di esempio</span>':''}
    <p class="sintesi">${esc(p.sintesi)}</p>
    ${p.punti&&p.punti.length?`<div class="sec"><h3>Da sapere</h3><ul>${p.punti.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}
    ${p.curiosita?`<div class="sec"><h3>Curiosità</h3><div class="curio">${esc(p.curiosita)}</div></div>`:''}
    <div class="meta"><span>${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</span>${p.data?`<span>Foto: ${esc(p.data)}</span>`:''}
      ${(p.fonti||[]).map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.titolo)}</a>`).join('')}</div>
  </div>`;
  if(p.foto){fetch(p.foto).then(r=>r.blob()).then(b=>{const i=card.querySelector('.hero img');if(i)i.src=URL.createObjectURL(b);}).catch(()=>{});}
  card.querySelector('.close').onclick=closeCard;
  card.classList.add('open');card.scrollTop=0;render();
}
function closeCard(){card.classList.remove('open');selected=null;suppressAuto=true;render();}

// apertura automatica: zoom alto + pin vicino al centro
let suppressAuto=false;
function autoOpen(){
  if(map.getZoom()<11){suppressAuto=false;return;}
  const ctr=map.latLngToContainerPoint(map.getCenter());let best=null,bd=1e9;
  places.forEach(p=>{if(hidden.has(p.tipo))return;const d=map.latLngToContainerPoint([p.lat,p.lng]).distanceTo(ctr);if(d<bd){bd=d;best=p;}});
  if(best&&bd<90&&best!==selected&&!suppressAuto)openCard(best);
}
map.on('zoomend',()=>{render();autoOpen();});
map.on('moveend',autoOpen);
map.on('click',()=>{if(selected)closeCard();});

function legend(){
  const el=document.getElementById('legend');
  el.innerHTML=Object.entries(TIPI).map(([k,v])=>{
    const n=places.filter(p=>p.tipo===k).length;
    return `<div class="lg-row ${hidden.has(k)?'off':''}" data-k="${k}"><span class="dot" style="background:${col(k)}"></span>${v.nome}<span class="n">${n||''}</span></div>`;
  }).join('');
  el.querySelectorAll('.lg-row').forEach(r=>r.onclick=()=>{const k=r.dataset.k;hidden.has(k)?hidden.delete(k):hidden.add(k);legend();render();});
}
document.getElementById('legendBtn').onclick=()=>document.getElementById('legend').classList.toggle('open');

fetch('places.json').then(r=>r.json()).then(d=>{
  places=d;const real=d.filter(p=>!p.esempio).length;
  document.getElementById('count').textContent=real?`${real} ${real===1?'luogo':'luoghi'}`:'Nessun luogo ancora · 1 esempio';
  legend();render();
}).catch(()=>{document.getElementById('count').textContent='Dati non caricati';});
setTimeout(()=>document.getElementById('hint').classList.add('hide'),6000);
})();
</script>
</body>
</html>
